{% load i18n %}<nav class="account account--{{ variant|default:'home' }}" aria-label="{% translate 'Account' %}">
  {% include "_language_switch.html" %}
  {% if user.is_authenticated %}
    <span class="account__hello">{% blocktranslate trimmed with name=user.first_name|default:user.get_username %}Hi, {{ name }}{% endblocktranslate %}</span>
    <a class="account__btn" href="{% url 'accounts:dashboard' %}">{% translate "Dashboard" %}</a>
    <form class="account__out" method="post" action="{% url 'accounts:logout' %}">
      {% csrf_token %}
      <button class="account__link" type="submit">{% translate "Log out" %}</button>
    </form>
  {% else %}
    <a class="account__btn" href="{% url 'accounts:login' %}" data-login-open aria-haspopup="dialog">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="6.6" r="3.4"/><path d="M3.6 17.2c.7-3.4 3.3-5.5 6.4-5.5s5.7 2.1 6.4 5.5"/></svg>
      {% translate "Log in" %}
    </a>
  {% endif %}
</nav>
