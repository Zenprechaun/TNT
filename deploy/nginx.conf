# Nginx settings for the Tahoe Neighborhood Table website (__DOMAIN__).
# setup_server.sh installs this as /etc/nginx/sites-available/tahoetable.
# Certbot then adds the HTTPS settings and the redirect from http to https.

# Limits repeated login attempts to about 10 a minute per visitor, with short bursts allowed.
limit_req_zone $binary_remote_addr zone=tahoetable_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    client_max_body_size 10m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    location = /accounts/login/ {
        limit_req zone=tahoetable_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /admin/login/ {
        limit_req zone=tahoetable_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
